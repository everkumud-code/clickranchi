# Review the VPS's existing Nginx configuration before enabling this file.
# This is a dedicated vhost example; do not replace other websites' server blocks.
server {
    listen 80;
    listen [::]:80;
    server_name clickranchi.com www.clickranchi.com;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
