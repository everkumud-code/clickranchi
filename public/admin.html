<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClickRanchi Newsroom</title><style>body{font:15px system-ui;background:#f7f5ef;color:#202820;margin:0;padding:24px}main{max-width:900px;margin:auto}section{background:white;border:1px solid #e6e1d7;border-radius:12px;padding:18px;margin:14px 0}input,button{padding:10px;border:1px solid #ccc;border-radius:7px;margin:4px}button{background:#173d2c;color:white;cursor:pointer}article{border-bottom:1px solid #eee;padding:12px 0}</style></head><body><main><h1>ClickRanchi Newsroom</h1><section id="login"><h2>Admin login</h2><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="msg"></p></section><section id="panel" hidden><button id="sync">Sync feeds now</button><div id="sources"></div><h2>Collected stories</h2><div id="stories"></div></section></main><script>
const $=s=>document.querySelector(s);$("#loginBtn").onclick=async()=>{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:$("#user").value,password:$("#pass").value})});if(!r.ok){$("#msg").textContent="Login failed. Configure ADMIN_PASSWORD in .env.";return}$("#login").hidden=true;$("#panel").hidden=false;refresh()};async function refresh(){let s=await fetch("/api/admin/sources").then(r=>r.json());$("#sources").innerHTML="<h2>Publishers</h2>"+s.sources.map(x=>"<p><b>"+x.name+"</b> — "+(x.lastError||x.lastSyncAt||"Waiting for first sync")+"</p>").join("");let d=await fetch("/api/admin/stories").then(r=>r.json());$("#stories").innerHTML=d.stories.map(x=>"<article><b>"+x.title+"</b><p>"+x.sourceName+" · "+x.status+"</p>"+["published","pending","rejected"].map(v=>'<button data-id="'+x.id+'" data-status="'+v+'">'+v+'</button>').join("")+"</article>").join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{await fetch("/api/admin/story-status",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:b.dataset.id,status:b.dataset.status})});refresh()})}$("#sync").onclick=async()=>{await fetch("/api/admin/sync",{method:"POST"});refresh()};
</script></body></html>
