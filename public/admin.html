<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClickRanchi Newsroom</title><style>
:root{--green:#173d2c;--paper:#f7f5ef;--line:#e7e2d8}*{box-sizing:border-box}body{font:15px system-ui;background:var(--paper);color:#202820;margin:0;padding:24px}main{max-width:1000px;margin:auto}section,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}input,button{padding:10px;border:1px solid #ccc;border-radius:7px;margin:4px}button{background:var(--green);color:white;cursor:pointer}button.secondary{background:white;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.stat{background:#f5f6f2;padding:13px;border-radius:9px}.stat b{font-size:24px;display:block}article{border-bottom:1px solid #eee;padding:12px 0}.muted{color:#777;font-size:12px}.error{color:#a22}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style></head><body><main><header><div><div style="font-size:25px;font-weight:900;color:#173d2c">CLICK<span style="color:#d99b37">RANCHI</span></div><div class="muted">AUTOMATED NEWSROOM CONSOLE</div></div><a href="/" style="color:#173d2c">← Public website</a></header>
<section id="login"><h2>Administrator sign in</h2><input id="user" autocomplete="username" placeholder="Username"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn">Sign in</button><p id="msg" class="muted"></p></section>
<div id="panel" hidden><div class="stats" id="stats"></div><section><h2>Feed operations</h2><button id="sync">Run feed sync now</button><button class="secondary" id="logout">Sign out</button><p id="syncmsg" class="muted"></p><div id="sources"></div></section><section><h2>Recent collected stories</h2><div id="stories"></div></section></div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function refresh(){const o=await api("/api/admin/overview");$("#stats").innerHTML=["published","pending","rejected"].map(k=>'<div class="stat"><b>'+(o.counts[k]||0)+'</b><span>'+k+'</span></div>').join("")+'<div class="stat"><b>'+esc(o.storage)+'</b><span>Storage</span></div>';$("#sources").innerHTML="<h3>Publisher feed health</h3>"+o.sources.map(s=>'<article><b>'+esc(s.name)+'</b> · '+(s.enabled?"Enabled":"Disabled")+' · '+(s.autoPublish?"Auto-publish":"No auto-publish")+'<p class="muted">Last sync: '+esc(s.lastSyncAt||"Not yet synced")+' · New: '+esc(s.lastAdded??"-")+' · '+esc(s.lastError||"No feed error recorded")+'</p></article>').join("");const d=await api("/api/admin/stories");$("#stories").innerHTML=d.stories.slice(0,40).map(s=>'<article><b>'+esc(s.title)+'</b><p class="muted">'+esc(s.sourceName)+' · '+esc(s.category)+' · '+esc(s.district)+' · '+esc(s.status)+'</p></article>').join("")||'<p class="muted">No stories collected yet.</p>'}
$("#loginBtn").onclick=async()=>{try{await api("/api/login",{method:"POST",body:JSON.stringify({username:$("#user").value,password:$("#pass").value})});$("#login").hidden=true;$("#panel").hidden=false;await refresh()}catch(e){$("#msg").textContent=e.message;$("#msg").className="error"}};
$("#sync").onclick=async()=>{try{$("#syncmsg").textContent="Syncing enabled feeds…";const d=await api("/api/admin/sync",{method:"POST",body:"{}"});$("#syncmsg").textContent="Sync completed. "+(d.added||0)+" new stories.";await refresh()}catch(e){$("#syncmsg").textContent=e.message}};
$("#logout").onclick=async()=>{await api("/api/logout",{method:"POST",body:"{}"});location.reload()};
</script></body></html>
