name: ClickRanchi CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      ADMIN_PASSWORD: ci-admin-password-long-enough
      SESSION_SECRET: ci-session-secret-with-at-least-thirty-two-bytes
      SITE_URL: https://clickranchi.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: docker compose config --quiet
